<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e60003">
  <!-- Launched from the home screen, both of these drop the browser chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <title>TCCC — Are You Ready?</title>
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <!-- LocAR injects the camera feed <video> behind this canvas. -->
  <canvas id="scene"></canvas>

  <div id="hud">
    <p id="status" data-tone="neutral" hidden></p>

    <div id="arrow" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 20l8-5 8 5Z" fill="currentColor"/></svg>
      <span id="arrow-label"></span>
    </div>

    <button id="panel-toggle" type="button" aria-label="Toggle telemetry">i</button>

    <dl id="panel">
      <dt>Your fix</dt><dd id="f-fix">—</dd>
      <dt>Accuracy</dt><dd id="f-accuracy">—</dd>
      <dt>Heading</dt><dd id="f-heading">—</dd>
      <dt>Anchor</dt><dd id="f-anchor">—</dd>
      <dt>Distance</dt><dd id="f-distance">—</dd>
      <dt>Subject</dt><dd id="f-subject">—</dd>
      <dt>Bearing</dt><dd id="f-bearing">—</dd>
      <dt>FPS</dt><dd id="f-fps">—</dd>
    </dl>
  </div>

  <div id="gate">
    <!-- The banner's diagonal sweep and dark contour band, echoed in CSS/UI chrome. -->
    <svg id="gate-ribbon" viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-20 130 L420 20 L420 90 L-20 200 Z" fill="rgba(255,255,255,0.14)"/>
      <path d="M-20 260 L420 160 L420 210 L-20 310 Z" fill="rgba(0,0,0,0.18)"/>
    </svg>
    <div class="gate-card">
      <p class="gate-kicker">TCCC presents</p>
      <h1 class="gate-logotype">Are you ready?</h1>
      <p class="gate-tagline">Best now, better forever.</p>
      <p>Point your phone at the world around you. We need your camera, location and motion sensors.</p>
      <button id="gate-start" type="button" disabled>Start AR</button>
      <p id="gate-message">Loading model…</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
